packages:
  - "apps/*"
  - "packages/*"
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
overrides:
  postcss: ">=8.5.10"
  "@hono/node-server": ">=1.19.13"
allowBuilds:
  '@parcel/watcher': true
  '@portfolio/db': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
